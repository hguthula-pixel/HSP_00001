<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Architectural VR & 3D Model Explorer</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --panel-bg: rgba(22, 27, 34, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent: #00e5ff;
      --accent-hover: #00b4cc;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 12px 24px;
      border-radius: 12px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .brand-title h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-size: 0.7rem;
      background: rgba(0, 229, 255, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      font-weight: 600;
    }

    .nav-modes {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Block Information Drawer */
    #info-panel {
      position: absolute;
      right: 20px;
      top: 90px;
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transform: translateX(400px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #info-panel.visible {
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-tag {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .panel-body h2 {
      font-size: 1.35rem;
      margin-bottom: 8px;
    }

    .panel-body p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .meta-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--panel-border);
      border-bottom: 1px solid var(--panel-border);
      margin-bottom: 20px;
    }

    .meta-spec-item span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .meta-spec-item strong {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .action-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }

    /* Bottom Control Bar */
    footer {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 auto;
    }

    .control-deck {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: 30px;
      display: flex;
      gap: 8px;
    }

    /* Loading and Notification Modal */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 21, 0.9);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    .loader-box {
      width: 320px;
      text-align: center;
    }

    .loader-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .loader-status {
      font-size: 0.8rem;
      font-weight: 600;
      font-family: monospace;
    }

    /* Standard WebXR Button Overrides */
    #VRButton {
      position: absolute !important;
      bottom: 24px !important;
      left: 24px !important;
      background: rgba(22, 27, 34, 0.9) !important;
      border: 1px solid var(--accent) !important;
      color: var(--accent) !important;
      font-family: inherit !important;
      font-size: 0.8rem !important;
      text-transform: uppercase !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      padding: 10px 18px !important;
      z-index: 20 !important;
    }
  </style>

  <!-- Import maps polyfill for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="webgl-container"></div>

  <div id="ui-overlay">
    <header class="interactive">
      <div class="brand-title">
        <h1 id="project-title">Poorna Market</h1>
        <span class="status-badge" id="mode-badge">3D Model</span>
      </div>
      <nav class="nav-modes">
        <button class="btn active" id="btn-mode-model">3D Model</button>
        <button class="btn" id="btn-mode-360">360° Tour</button>
        <button class="btn" id="btn-mode-reset">Reset View</button>
      </nav>
    </header>

    <aside id="info-panel" class="interactive">
      <div class="panel-header">
        <span class="panel-tag" id="panel-tag">Block Node</span>
        <button class="close-btn" id="btn-close-panel">&times;</button>
      </div>
      <div class="panel-body">
        <h2 id="panel-name">Market Block</h2>
        <p id="panel-desc">Block architectural details and spatial function description.</p>
        <div class="meta-specs">
          <div class="meta-spec-item">
            <span>Type</span>
            <strong id="panel-type">Retail</strong>
          </div>
          <div class="meta-spec-item">
            <span>Area</span>
            <strong id="panel-area">1,200 m²</strong>
          </div>
        </div>
        <button class="action-btn" id="btn-enter-block-360">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
          Explore in 360°
        </button>
      </div>
    </aside>

    <footer class="interactive">
      <div class="control-deck">
        <button class="btn" id="btn-fullscreen">Fullscreen</button>
        <button class="btn" id="btn-toggle-wireframe">Wireframe</button>
      </div>
    </footer>
  </div>

  <div id="loading-overlay">
    <div class="loader-box">
      <div class="loader-title" id="loader-title">Loading Environment</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="loader-status" id="loader-status">0%</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // 01 — PROJECT REPOSITORY / DATABASE MOCK
    const PROJECT_CONFIG = {
      id: "poorna-market",
      name: "Poorna Market Redevelopment",
      modelUrl: "/models/poorna-market.glb", // Point to real GLB if available
      initialCamera: { x: 40, y: 28, z: 45, tx: 0, ty: 2, tz: 0 },
      blocks: [
        {
          id: "block-puja",
          name: "Puja Market",
          type: "Retail / Traditional",
          area: "1,850 m²",
          desc: "Multi-level cultural market hall for ritual goods, flowers, and incense.",
          sceneId: "puja-scene",
          color: 0xe67e22,
          bounds: { x: -14, y: 3, z: -8, w: 10, h: 6, d: 14 }
        },
        {
          id: "block-meat",
          name: "Meat & Fish Market",
          type: "Perishables / Cold-Chain",
          area: "2,400 m²",
          desc: "Hygienic, climate-controlled retail spaces with specialized drainage.",
          sceneId: "meat-scene",
          color: 0xc0392b,
          bounds: { x: 12, y: 4, z: -6, w: 12, h: 8, d: 16 }
        },
        {
          id: "block-vegetable",
          name: "Vegetable Terminal",
          type: "Wholesale / Retail",
          area: "3,100 m²",
          desc: "High-volume naturally ventilated market hall with direct logistics docks.",
          sceneId: "vegetable-scene",
          color: 0x27ae60,
          bounds: { x: 0, y: 3.5, z: 12, w: 22, h: 7, d: 12 }
        }
      ],
      scenes: {
        "puja-scene": {
          name: "Puja Market Plaza",
          color: 0x4a2810 // Procedural sky color fallback
        },
        "meat-scene": {
          name: "Meat Logistics Yard",
          color: 0x1f2421
        },
        "vegetable-scene": {
          name: "Vegetable Trading Floor",
          color: 0x1a3323
        }
      }
    };

    class ArchitectureViewer {
      constructor(containerId) {
        this.container = document.getElementById(containerId);
        this.mode = 'MODEL'; // 'MODEL' | '360'
        this.selectedBlock = null;
        this.intersectableObjects = [];
        this.blockMeshes = new Map();

        this.initEngine();
        this.initLighting();
        this.initEnvironment();
        this.initControls();
        this.initPanoRig();
        this.initWebXR();
        this.initRaycasting();
        this.bindUI();

        this.loadArchitecture();
        this.animate = this.animate.bind(this);
        this.renderer.setAnimationLoop(this.animate);
      }

      initEngine() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0f1115);

        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.set(
          PROJECT_CONFIG.initialCamera.x,
          PROJECT_CONFIG.initialCamera.y,
          PROJECT_CONFIG.initialCamera.z
        );

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.xr.enabled = true;
        this.container.appendChild(this.renderer.domElement);

        window.addEventListener('resize', this.onResize.bind(this));
      }

      initLighting() {
        this.hemiLight = new THREE.HemisphereLight(0xffffff, 0x333940, 0.8);
        this.scene.add(this.hemiLight);

        this.dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        this.dirLight.position.set(45, 60, 30);
        this.dirLight.castShadow = true;
        this.dirLight.shadow.mapSize.width = 2048;
        this.dirLight.shadow.mapSize.height = 2048;
        this.dirLight.shadow.camera.near = 0.5;
        this.dirLight.shadow.camera.far = 200;
        const d = 35;
        this.dirLight.shadow.camera.left = -d;
        this.dirLight.shadow.camera.right = d;
        this.dirLight.shadow.camera.top = d;
        this.dirLight.shadow.camera.bottom = -d;
        this.scene.add(this.dirLight);
      }

      initEnvironment() {
        // Architectural Ground Plane Grid
        const grid = new THREE.GridHelper(120, 60, 0x00e5ff, 0x21262d);
        grid.position.y = -0.01;
        this.scene.add(grid);

        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x12151a, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        this.scene.add(ground);
      }

      initControls() {
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxPolarAngle = Math.PI / 2 - 0.01; // Block clipping beneath ground
        this.controls.target.set(
          PROJECT_CONFIG.initialCamera.tx,
          PROJECT_CONFIG.initialCamera.ty,
          PROJECT_CONFIG.initialCamera.tz
        );
      }

      initPanoRig() {
        // Inverted sphere for 360° equirectangular projection
        const sphereGeo = new THREE.SphereGeometry(60, 48, 32);
        sphereGeo.scale(-1, 1, 1);
        this.panoMaterial = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          visible: false,
          side: THREE.FrontSide
        });
        this.panoSphere = new THREE.Mesh(sphereGeo, this.panoMaterial);
        this.scene.add(this.panoSphere);
      }

      initWebXR() {
        document.body.appendChild(VRButton.createButton(this.renderer));

        // XR Controller Line Visuals
        const controllerModelFactory = new XRControllerModelFactory();
        for (let i = 0; i < 2; i++) {
          const controller = this.renderer.xr.getController(i);
          controller.addEventListener('selectstart', this.onXRSelect.bind(this, controller));
          this.scene.add(controller);

          const grip = this.renderer.xr.getControllerGrip(i);
          grip.add(controllerModelFactory.createControllerModel(grip));
          this.scene.add(grip);

          const rayGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -8)
          ]);
          const rayMat = new THREE.LineBasicMaterial({ color: 0x00e5ff });
          controller.add(new THREE.Line(rayGeo, rayMat));
        }
      }

      initRaycasting() {
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();

        this.container.addEventListener('pointerdown', (e) => {
          this.pX = e.clientX;
          this.pY = e.clientY;
        });

        this.container.addEventListener('pointerup', (e) => {
          // Reject drag gestures
          if (Math.abs(e.clientX - this.pX) > 4 || Math.abs(e.clientY - this.pY) > 4) return;
          this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          this.processRaycast(this.mouse, this.camera);
        });
      }

      loadArchitecture() {
        this.updateLoading(30, 'Searching for Project Geometry...');
        this.modelGroup = new THREE.Group();
        this.scene.add(this.modelGroup);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        gltfLoader.load(
          PROJECT_CONFIG.modelUrl,
          (gltf) => {
            this.updateLoading(85, 'Parsing Meshes...');
            this.modelGroup.add(gltf.scene);
            this.bindGLTFBlocks(gltf.scene);
            this.finishLoading();
          },
          (xhr) => {
            if (xhr.lengthComputable) {
              const p = Math.round((xhr.loaded / xhr.total) * 100);
              this.updateLoading(p, `Loading Assets: ${p}%`);
            }
          },
          () => {
            // Fallback generation: Builds architectural massing if external .GLB file is unavailable
            this.buildProceduralMassing();
            this.finishLoading();
          }
        );
      }

      buildProceduralMassing() {
        PROJECT_CONFIG.blocks.forEach((block) => {
          const b = block.bounds;
          const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
          const mat = new THREE.MeshStandardMaterial({
            color: block.color,
            roughness: 0.35,
            metalness: 0.15,
            wireframe: false
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(b.x, b.y, b.z);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.userData = { blockId: block.id, originalColor: block.color };

          this.modelGroup.add(mesh);
          this.intersectableObjects.push(mesh);
          this.blockMeshes.set(block.id, mesh);
        });
      }

      bindGLTFBlocks(scene) {
        scene.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            PROJECT_CONFIG.blocks.forEach((block) => {
              if (node.name.toLowerCase().includes(block.id.toLowerCase())) {
                node.userData.blockId = block.id;
                this.intersectableObjects.push(node);
                this.blockMeshes.set(block.id, node);
              }
            });
          }
        });
      }

      processRaycast(coords, cameraInstance) {
        if (this.mode !== 'MODEL') return;
        this.raycaster.setFromCamera(coords, cameraInstance);
        const hits = this.raycaster.intersectObjects(this.intersectableObjects, false);

        if (hits.length > 0) {
          const blockId = hits[0].object.userData.blockId;
          this.selectBlock(blockId);
        } else {
          this.clearSelection();
        }
      }

      onXRSelect(controller) {
        if (this.mode !== 'MODEL') return;
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const hits = this.raycaster.intersectObjects(this.intersectableObjects, false);
        if (hits.length > 0) {
          const blockId = hits[0].object.userData.blockId;
          this.selectBlock(blockId);
        }
      }

      selectBlock(blockId) {
        this.clearSelection();
        const block = PROJECT_CONFIG.blocks.find(b => b.id === blockId);
        if (!block) return;

        this.selectedBlock = block;
        const mesh = this.blockMeshes.get(blockId);

        if (mesh) {
          mesh.material.emissive = new THREE.Color(0x00e5ff);
          mesh.material.emissiveIntensity = 0.5;

          // Align Camera target to architectural block
          this.controls.target.lerp(mesh.position, 0.8);
        }

        this.renderPanel(block);
      }

      clearSelection() {
        if (!this.selectedBlock) return;
        const mesh = this.blockMeshes.get(this.selectedBlock.id);
        if (mesh) {
          mesh.material.emissive = new THREE.Color(0x000000);
          mesh.material.emissiveIntensity = 0;
        }
        this.selectedBlock = null;
        document.getElementById('info-panel').classList.remove('visible');
      }

      setMode(mode, targetSceneId = null) {
        this.mode = mode;
        const badge = document.getElementById('mode-badge');
        const btnModel = document.getElementById('btn-mode-model');
        const btn360 = document.getElementById('btn-mode-360');

        if (mode === 'MODEL') {
          this.panoSphere.visible = false;
          this.modelGroup.visible = true;
          this.controls.enableZoom = true;
          this.controls.autoRotate = false;
          this.resetCamera();

          badge.textContent = "3D Model";
          badge.style.color = "var(--accent)";
          btnModel.classList.add('active');
          btn360.classList.remove('active');
        } else if (mode === '360') {
          this.clearSelection();
          this.modelGroup.visible = false;
          this.panoSphere.visible = true;
          this.controls.enableZoom = false; // Preserve field of view inside 360 sphere
          this.controls.autoRotate = true;
          this.controls.autoRotateSpeed = 0.4;

          const sceneData = PROJECT_CONFIG.scenes[targetSceneId] || PROJECT_CONFIG.scenes["puja-scene"];
          this.panoMaterial.color.setHex(sceneData.color);

          this.camera.position.set(0, 0, 0.1);
          this.controls.target.set(0, 0, 0);

          badge.textContent = `360° VR: ${sceneData.name}`;
          badge.style.color = "#00ff88";
          btn360.classList.add('active');
          btnModel.classList.remove('active');
        }
      }

      resetCamera() {
        this.camera.position.set(
          PROJECT_CONFIG.initialCamera.x,
          PROJECT_CONFIG.initialCamera.y,
          PROJECT_CONFIG.initialCamera.z
        );
        this.controls.target.set(
          PROJECT_CONFIG.initialCamera.tx,
          PROJECT_CONFIG.initialCamera.ty,
          PROJECT_CONFIG.initialCamera.tz
        );
      }

      renderPanel(block) {
        document.getElementById('panel-tag').textContent = block.id;
        document.getElementById('panel-name').textContent = block.name;
        document.getElementById('panel-desc').textContent = block.desc;
        document.getElementById('panel-type').textContent = block.type;
        document.getElementById('panel-area').textContent = block.area;
        document.getElementById('info-panel').classList.add('visible');
      }

      bindUI() {
        document.getElementById('btn-mode-model').addEventListener('click', () => this.setMode('MODEL'));
        document.getElementById('btn-mode-360').addEventListener('click', () => this.setMode('360'));
        document.getElementById('btn-mode-reset').addEventListener('click', () => this.resetCamera());
        document.getElementById('btn-close-panel').addEventListener('click', () => this.clearSelection());

        document.getElementById('btn-enter-block-360').addEventListener('click', () => {
          if (this.selectedBlock) {
            this.setMode('360', this.selectedBlock.sceneId);
          }
        });

        document.getElementById('btn-toggle-wireframe').addEventListener('click', () => {
          this.blockMeshes.forEach(mesh => {
            mesh.material.wireframe = !mesh.material.wireframe;
          });
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }

      updateLoading(percent, text) {
        document.getElementById('progress-bar').style.width = `${percent}%`;
        document.getElementById('loader-status').textContent = `${percent}%`;
        document.getElementById('loader-title').textContent = text;
      }

      finishLoading() {
        this.updateLoading(100, 'Ready');
        const overlay = document.getElementById('loading-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 400);
      }

      onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      animate() {
        this.controls.update();
        this.renderer.render(this.scene, this.camera);
      }
    }

    // Initialize application instance on DOM load
    window.addEventListener('DOMContentLoaded', () => {
      new ArchitectureViewer('webgl-container');
    });
  </script>
</body>
</html>
